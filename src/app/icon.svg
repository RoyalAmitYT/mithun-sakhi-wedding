<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Burgundy Radial Gradient -->
    <radialGradient id="burgundyVignette" cx="50%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#6F1222" />
      <stop offset="45%" stop-color="#48070F" />
      <stop offset="100%" stop-color="#240207" />
    </radialGradient>

    <!-- Metallic Antique Champagne Gold Gradient -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="20%" stop-color="#E8C882" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B88E28" />
      <stop offset="100%" stop-color="#F3DC9B" />
    </linearGradient>

    <linearGradient id="diamondGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C69C30" />
      <stop offset="50%" stop-color="#FFFBF0" />
      <stop offset="100%" stop-color="#B3861B" />
    </linearGradient>

    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Squircle Badge with Deep Royal Burgundy Fill -->
  <rect width="512" height="512" rx="116" fill="url(#burgundyVignette)" />

  <!-- Outer Delicate Metallic Gold Border (Optimized for 1px stroke at 32px / crisp edge at 16px) -->
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="url(#goldLuster)" stroke-width="14" />

  <!-- Inner Hairline Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="86" fill="none" stroke="#FFF3D1" stroke-width="2" stroke-opacity="0.35" />

  <!-- Central M • S Wedding Monogram -->
  <g filter="url(#subtleDrop)">
    <!-- Letter M (Custom Roman Serif Geometry with bold optical stems) -->
    <path
      fill="url(#goldLuster)"
      d="
        M 76,356
        L 76,342 C 88,342 96,338 98,324 L 98,188 C 96,174 88,170 76,170 L 76,156
        L 144,156 L 144,170 C 132,170 124,174 122,188 L 122,298
        L 186,156 L 208,156
        L 228,298 L 228,188 C 226,174 218,170 206,170 L 206,156
        L 254,156 L 254,170 C 242,170 234,174 232,188 L 232,324 C 234,338 242,342 254,342 L 254,356
        L 200,356 L 200,342 C 212,342 216,338 216,324 L 216,212
        L 162,356 L 144,356
        L 110,212 L 110,324 C 110,338 114,342 126,342 L 126,356
        Z
      "
    />

    <!-- Center Auspicious Diamond Emblem (◆) -->
    <g transform="translate(266, 256)">
      <!-- Outer diamond facet -->
      <polygon points="0,-20 20,0 0,20 -20,0" fill="url(#diamondGold)" />
      <!-- Inner brilliant core -->
      <polygon points="0,-10 10,0 0,10 -10,0" fill="#FFFDF8" />
    </g>

    <!-- Letter S (Classical Roman Serif Geometry with bold spine) -->
    <path
      fill="url(#goldLuster)"
      d="
        M 424,206
        C 420,182 404,156 366,156
        C 330,156 304,178 304,208
        C 304,232 322,246 348,256
        L 372,266
        C 402,278 424,296 424,328
        C 424,360 392,372 358,372
        C 324,372 294,358 282,328
        L 300,320
        C 310,342 332,354 358,354
        C 388,354 406,340 406,322
        C 406,298 384,284 358,272
        L 334,262
        C 308,250 286,234 286,204
        C 286,174 316,144 362,144
        C 392,144 418,158 430,186
        L 444,186
        L 438,222
        L 424,222
        Z
      "
    />
  </g>
</svg>